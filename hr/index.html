document.addEventListener("DOMContentLoaded",function(){
  setTimeout(function(){

iv style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--border-light);border-radius:8px;"><div><div class="font-medium">Team Building Day</div><div class="text-xs text-muted">All HK staff</div></div><span class="badge badge-success">Sep 8</span></div> </div></div></div> <script>document.addEventListener("DOMContentLoaded",function(){setTimeout(function(){if(typeof PROIAQ!=="undefined"){PROIAQ.initHeadcountChart("hrHeadcountChart");PROIAQ.initAttendanceChart("hrAttChart");if(typeof lucide!=="undefined")lucide.createIcons();}},200);});</script> `);
