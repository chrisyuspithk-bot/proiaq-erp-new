<!DOCTYPE html>
<html lang="en-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO-IAQ ERP Suite — Dashboard</title>
  <meta name="description" content="PRO-IAQ ERP Suite Professional Edition 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wave-bg"></div>
<div id="shell-app"></div>
<script src="js/main.js"></script>
<script src="js/charts.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    PROIAQ.pageContent(`<!-- =========================================================
             KPI ROW
             ========================================================= -->
        <div class="grid grid-4 mb-6">
          <!-- Revenue -->
          <div class="card kpi-card">
            <div class="kpi-icon blue"><i data-lucide="dollar-sign"></i></div>
            <div class="kpi-label">Total Revenue (YTD)</div>
            <div class="kpi-value">HK$74.2M</div>
            <div class="kpi-sub">+18.5% vs LY</div>
            <div class="kpi-change up">
              <i data-lucide="trending-up" style="width:14px;height:14px;"></i> +12.3%
            </div>
          </div>

          <!-- Gross Profit -->
          <div class="card kpi-card">
            <div class="kpi-icon teal"><i data-lucide="pie-chart"></i></div>
            <div class="kpi-label">Gross Margin</div>
            <div class="kpi-value">38.2%</div>
            <div class="kpi-sub">Target: 35%</div>
            <div class="kpi-change up">
              <i data-lucide="trending-up" style="width:14px;height:14px;"></i> +2.4pp
            </div>
          </div>

          <!-- Outstanding Receivables -->
          <div class="card kpi-card">
            <div class="kpi-icon amber"><i data-lucide="clock"></i></div>
            <div class="kpi-label">Outstanding AR</div>
            <div class="kpi-value">HK$13.5M</div>
            <div class="kpi-sub">Avg 32 days</div>
            <div class="kpi-change down">
              <i data-lucide="alert-circle" style="width:14px;height:14px;"></i> +5 days
            </div>
          </div>

          <!-- Active Orders -->
          <div class="card kpi-card">
            <div class="kpi-icon green"><i data-lucide="package-check"></i></div>
            <div class="kpi-label">Active Orders</div>
            <div class="kpi-value">186</div>
            <div class="kpi-sub">98.4% OTIF</div>
            <div class="kpi-change up">
              <i data-lucide="trending-up" style="width:14px;height:14px;"></i> 24 new this week
            </div>
          </div>
        </div>

        <!-- =========================================================
             CHARTS ROW 1: Revenue Trend + Revenue by Region
             ========================================================= -->
        <div class="grid grid-2-1 mb-6">
          <!-- Revenue & Profit Trend -->
          <div class="card">
            <div class="card-header">
              <h3>Revenue &amp; Profit Trend</h3>
              <div style="display:flex;gap:8px;">
                <button class="btn-ghost btn-sm active">12M</button>
                <button class="btn-ghost btn-sm">6M</button>
                <button class="btn-ghost btn-sm">3M</button>
              </div>
            </div>
            <div class="card-body" style="height:360px;">
              <div class="chart-container" style="height:100%;">
                <canvas id="revenueChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Revenue by Region -->
          <div class="card">
            <div class="card-header">
              <h3>Revenue by Region</h3>
              <i data-lucide="globe" style="width:16px;height:16px;color:var(--text-muted);"></i>
            </div>
            <div class="card-body" style="height:360px;">
              <div class="chart-container" style="height:100%;">
                <canvas id="regionChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- =========================================================
             CHARTS ROW 2: Cash Flow + Expense Breakdown + AI Insights
             ========================================================= -->
        <div class="grid grid-3 mb-6">
          <!-- Cash Flow -->
          <div class="card">
            <div class="card-header">
              <h3>Cash Flow</h3>
              <span class="badge badge-success">Positive</span>
            </div>
            <div class="card-body" style="height:320px;">
              <div class="chart-container" style="height:100%;">
                <canvas id="cashFlowChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Expense Breakdown -->
          <div class="card">
            <div class="card-header">
              <h3>Expense Breakdown</h3>
              <span class="text-xs text-muted">June 2026</span>
            </div>
            <div class="card-body" style="height:320px;">
              <div class="chart-container" style="height:100%;">
                <canvas id="expenseChart"></canvas>
              </div>
            </div>
          </div>

          <!-- AI Insights -->
          <div class="card">
            <div class="card-header">
              <h3>
                <i data-lucide="sparkles" style="width:18px;height:18px;color:var(--teal);margin-right:6px;"></i>
                AI Insights
              </h3>
              <span class="badge badge-info pulse">Live</span>
            </div>
            <div class="card-body" style="height:320px;overflow-y:auto;">
              <div class="ai-insight-item">
                <div class="ai-insight-icon trend-up">
                  <i data-lucide="trending-up"></i>
                </div>
                <div class="ai-insight-content">
                  <div class="ai-insight-title">Revenue forecast: +22% for Q3</div>
                  <div class="ai-insight-desc">Based on current pipeline velocity and seasonal trends in APAC markets, Q3 2026 revenue is projected at HK$28.5M.</div>
                </div>
              </div>
              <div class="ai-insight-item">
                <div class="ai-insight-icon alert">
                  <i data-lucide="alert-triangle"></i>
                </div>
                <div class="ai-insight-content">
                  <div class="ai-insight-title">Inventory alert: 3 SKUs below safety stock</div>
                  <div class="ai-insight-desc">IAQ-Sensor-Pro, HEPA-Filter-XL, and Carbon-Cartridge-V2 will stock out within 14 days at current consumption rates.</div>
                </div>
              </div>
              <div class="ai-insight-item">
                <div class="ai-insight-icon info">
                  <i data-lucide="users"></i>
                </div>
                <div class="ai-insight-content">
                  <div class="ai-insight-title">Attrition risk detected in Engineering</div>
                  <div class="ai-insight-desc">2 senior engineers show declining engagement scores. Recommend retention review within 7 days.</div>
                </div>
              </div>
              <div class="ai-insight-item">
                <div class="ai-insight-icon trend-down">
                  <i data-lucide="clock"></i>
                </div>
                <div class="ai-insight-content">
                  <div class="ai-insight-title">AR aging worsening: 61-90 day bucket +15%</div>
                  <div class="ai-insight-desc">3 major accounts in Singapore overdue. Suggested: initiate dunning workflow for HK$2.8M outstanding.</div>
                </div>
              </div>
              <div class="ai-insight-item">
                <div class="ai-insight-icon trend-up">
                  <i data-lucide="zap"></i>
                </div>
                <div class="ai-insight-content">
                  <div class="ai-insight-title">Production efficiency at all-time high</div>
                  <div class="ai-insight-desc">OEE reached 92.3% in June. Line 3 (Tsuen Wan) consistently outperforming by 8% vs other lines.</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- =========================================================
             BOTTOM ROW: Recent Activity + Quick Actions
             ========================================================= -->
        <div class="grid grid-2 mb-6">
          <!-- Recent Activity -->
          <div class="card">
            <div class="card-header">
              <h3>Recent Activity</h3>
              <a href="#" class="text-sm" style="color:var(--blue);">View All</a>
            </div>
            <div class="card-body condensed">
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--teal);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>PO-2026-0892</strong> approved — HK$142,500 · Tai Hing Supplies</div>
                  <div class="activity-time">12 minutes ago</div>
                </div>
              </div>
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--blue);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>INV-2026-1642</strong> paid — HK$86,300 · ClearAir Singapore Pte Ltd</div>
                  <div class="activity-time">34 minutes ago</div>
                </div>
              </div>
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--green);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>Work Order #WO-4521</strong> completed — Line 3, Tsuen Wan</div>
                  <div class="activity-time">1 hour ago</div>
                </div>
              </div>
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--amber);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>Leave request</strong> submitted — Emily Chan (Jul 28–30)</div>
                  <div class="activity-time">2 hours ago</div>
                </div>
              </div>
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--text-muted);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>New customer</strong> registered — Tokyo Air Systems K.K.</div>
                  <div class="activity-time">3 hours ago</div>
                </div>
              </div>
              <div class="activity-item">
                <div class="activity-dot" style="background:var(--red);"></div>
                <div class="activity-content">
                  <div class="activity-text"><strong>Stock alert</strong> — IAQ-Sensor-Pro below reorder point (8 units)</div>
                  <div class="activity-time">4 hours ago</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="card">
            <div class="card-header">
              <h3>Quick Actions</h3>
            </div>
            <div class="card-body condensed">
              <div class="quick-actions-grid">
                <button class="quick-action">
                  <i data-lucide="file-plus"></i> New Invoice
                </button>
                <button class="quick-action">
                  <i data-lucide="shopping-cart"></i> New Sales Order
                </button>
                <button class="quick-action">
                  <i data-lucide="truck"></i> New Purchase Order
                </button>
                <button class="quick-action">
                  <i data-lucide="user-plus"></i> Add Customer
                </button>
                <button class="quick-action">
                  <i data-lucide="clipboard-list"></i> New Work Order
                </button>
                <button class="quick-action">
                  <i data-lucide="calendar-plus"></i> Schedule Meeting
                </button>
              </div>

              <div class="mt-6">
                <h4 class="mb-4">Upcoming Deadlines</h4>
                <div style="display:flex;flex-direction:column;gap:12px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--border-light);border-radius:8px;">
                    <div>
                      <div class="text-sm font-medium">Quarterly GST Filing</div>
                      <div class="text-xs text-muted">IRAS Singapore</div>
                    </div>
                    <span class="badge badge-warning">Jul 31</span>
                  </div>
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--border-light);border-radius:8px;">
                    <div>
                      <div class="text-sm font-medium">Payroll Run — August</div>
                      <div class="text-xs text-muted">HK &amp; SG entities</div>
                    </div>
                    <span class="badge badge-info">Aug 25</span>
                  </div>
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--border-light);border-radius:8px;">
                    <div>
                      <div class="text-sm font-medium">Annual Audit Prep</div>
                      <div class="text-xs text-muted">FY 2026 — PwC Hong Kong</div>
                    </div>
                    <span class="badge badge-neutral">Sep 15</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`);
    var timeEl = document.getElementById("dashboard-time");
    if (timeEl) {
      timeEl.textContent = new Date().toLocaleString("en-HK", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    }
    PROIAQ.initRevenueChart("revenueChart");
    PROIAQ.initRegionChart("regionChart");
    PROIAQ.initCashFlowChart("cashFlowChart");
    PROIAQ.initExpenseChart("expenseChart");
    if (typeof lucide !== "undefined") lucide.createIcons();
  }, 150);
});
</script>
</body>
</html>
