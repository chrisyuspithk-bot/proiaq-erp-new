document.addEventListener("DOMContentLoaded",function(){
  setTimeout(function(){
    PROIAQ.pageContent(` <div class="grid grid-2 mb-6"> <div class="card"><div class="card-header"><h3>General Settings</h3></div><div class="card-body"> <div class="form-group"><label class="form-label">Company Name</label><input class="form-input" value="PRO-IAQ Hong Kong Limited"></div> <div class="form-group"><label class="form-label">Default Currency</label><select class="form-select"><option selected>HKD — Hong Kong Dollar</option><option>SGD — Singapore Dollar</option><option>USD — US Dollar</option></select></div> <div class="form-group"><label class="form-label">Fiscal Year Start</label><select class="form-select"><option selected>January 1</option><option>April 1</option><option>July 1</option></select></div> <div class="form-group"><label class="form-label">Date Format</label><select class="form-select"><option selected>DD/MM/YYYY</option><option>MM/DD/YYYY</option><option>YYYY-MM-DD</option></select></div> <div class="form-group"><label class="form-label">Timezone</label><select class="form-select"><option selected>Asia/Hong_Kong (UTC+8)</option><option>Asia/Singapore (UTC+8)</option><option>Asia/Tokyo (UTC+9)</option></select></div> <button class="btn-primary"><i data-lucide="save"></i> Save Changes</button> </div></div> <div class="card"><div class="card-header"><h3>System Information</h3></div><div class="card-body condensed"> <div style="display:flex;flex-direction:column;gap:12px;"> <div class="flex justify-between"><span class="text-sm text-muted">Version</span><span class="text-sm font-medium">PRO-IAQ 2026.3.1</span></div> <div class="flex justify-between"><span class="text-sm text-muted">License</span><span class="text-sm font-medium">Professional · 50 seats</span></div> <div class="flex justify-between"><span class="text-sm text-muted">Last Backup</span><span class="text-sm font-medium">24 Jul 2026 03:00 HKT</span></div> <div class="flex justify-between"><span class="text-sm text-muted">Database</span><span class="text-sm font-medium">PostgreSQL
